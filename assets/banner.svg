<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ========================= -->
    <!-- BACKGROUND -->
    <!-- ========================= -->

    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">

      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101827"/>

    </linearGradient>


    <!-- ========================= -->
    <!-- ACCENT -->
    <!-- ========================= -->

    <linearGradient id="accent"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>

    </linearGradient>


    <!-- ========================= -->
    <!-- CODE PANEL -->
    <!-- ========================= -->

    <linearGradient id="panel"
                    x1="0" y1="0"
                    x2="1" y2="1">

      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>

    </linearGradient>


    <!-- ========================= -->
    <!-- GLOW -->
    <!-- ========================= -->

    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="35"/>

    </filter>


    <!-- ========================= -->
    <!-- SHADOW -->
    <!-- ========================= -->

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="22"
        flood-color="#000000"
        flood-opacity=".45"/>

    </filter>


    <!-- ========================= -->
    <!-- TYPOGRAPHY -->
    <!-- ========================= -->

    <style>

      .font {
        font-family:
          Inter,
          Arial,
          Helvetica,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          monospace;
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="400"
    rx="24"
    fill="url(#background)"/>


  <!-- ================================================= -->
  <!-- AMBIENT LIGHT -->
  <!-- ================================================= -->

  <circle
    cx="1050"
    cy="40"
    r="170"
    fill="#4F46E5"
    opacity=".12"
    filter="url(#glow)"/>


  <circle
    cx="90"
    cy="360"
    r="150"
    fill="#06B6D4"
    opacity=".07"
    filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- SUBTLE GRID -->
  <!-- ================================================= -->

  <g
    stroke="#94A3B8"
    stroke-opacity=".045"
    stroke-width="1">

    <!-- Horizontal -->
    <path d="M0 80H1200"/>
    <path d="M0 160H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 320H1200"/>

    <!-- Vertical -->
    <path d="M80 0V400"/>
    <path d="M180 0V400"/>
    <path d="M280 0V400"/>
    <path d="M380 0V400"/>
    <path d="M480 0V400"/>
    <path d="M580 0V400"/>
    <path d="M680 0V400"/>
    <path d="M780 0V400"/>
    <path d="M880 0V400"/>
    <path d="M980 0V400"/>
    <path d="M1080 0V400"/>

  </g>


  <!-- ================================================= -->
  <!-- ACCENT MARK -->
  <!-- ================================================= -->

  <rect
    x="64"
    y="70"
    width="58"
    height="3"
    rx="2"
    fill="url(#accent)"/>


  <!-- ================================================= -->
  <!-- NAME -->
  <!-- ================================================= -->

  <text
    x="64"
    y="132"
    class="font"
    fill="#F8FAFC"
    font-size="43"
    font-weight="800"
    letter-spacing="-1.2">

    ATHARV HOLKAR

  </text>


  <!-- ================================================= -->
  <!-- ROLE -->
  <!-- ================================================= -->

  <text
    x="64"
    y="181"
    class="font"
    fill="#67E8F9"
    font-size="32"
    font-weight="750"
    letter-spacing="-0.5">

    FULL STACK DEVELOPER

  </text>


  <!-- ================================================= -->
  <!-- SUBTITLE -->
  <!-- ================================================= -->

  <text
    x="66"
    y="215"
    class="font"
    fill="#94A3B8"
    font-size="16">

    Building modern, scalable websites.

  </text>


  <!-- ================================================= -->
  <!-- TECHNOLOGY PILLS -->
  <!-- ================================================= -->

  <g
    class="font"
    font-size="11"
    font-weight="700">


    <!-- React -->

    <rect
      x="66"
      y="245"
      width="76"
      height="28"
      rx="14"
      fill="#0B1F2C"
      stroke="#22D3EE"
      stroke-opacity=".35"/>

    <text
      x="104"
      y="263"
      text-anchor="middle"
      fill="#67E8F9">

      React

    </text>


    <!-- Node.js -->

    <rect
      x="150"
      y="245"
      width="78"
      height="28"
      rx="14"
      fill="#10251B"
      stroke="#4ADE80"
      stroke-opacity=".30"/>

    <text
      x="189"
      y="263"
      text-anchor="middle"
      fill="#86EFAC">

      Node.js

    </text>


    <!-- MongoDB -->

    <rect
      x="236"
      y="245"
      width="88"
      height="28"
      rx="14"
      fill="#10261F"
      stroke="#34D399"
      stroke-opacity=".30"/>

    <text
      x="280"
      y="263"
      text-anchor="middle"
      fill="#6EE7B7">

      MongoDB

    </text>


    <!-- Express -->

    <rect
      x="332"
      y="245"
      width="92"
      height="28"
      rx="14"
      fill="#151B2B"
      stroke="#818CF8"
      stroke-opacity=".35"/>

    <text
      x="378"
      y="263"
      text-anchor="middle"
      fill="#A5B4FC">

      Express.js

    </text>

  </g>


  <!-- ================================================= -->
  <!-- TERMINAL -->
  <!-- ================================================= -->

  <text
    x="66"
    y="320"
    class="mono"
    font-size="12">

    <tspan fill="#475569">$</tspan>

    <tspan fill="#38BDF8">
      whoami
    </tspan>

    <tspan fill="#64748B">
      →
    </tspan>

    <tspan fill="#CBD5E1">
      atharv-holkar
    </tspan>

  </text>


  <!-- ================================================= -->
  <!-- RIGHT CODE PANEL -->
  <!-- ================================================= -->

  <rect
    x="610"
    y="48"
    width="520"
    height="304"
    rx="22"
    fill="url(#panel)"
    stroke="#FFFFFF"
    stroke-opacity=".10"
    filter="url(#shadow)"/>


  <!-- ================================================= -->
  <!-- CODE PANEL HEADER -->
  <!-- ================================================= -->

  <rect
    x="610"
    y="48"
    width="520"
    height="42"
    rx="22"
    fill="#FFFFFF"
    fill-opacity=".025"/>


  <!-- Window dots -->

  <circle
    cx="636"
    cy="69"
    r="4"
    fill="#475569"/>

  <circle
    cx="650"
    cy="69"
    r="4"
    fill="#475569"/>

  <circle
    cx="664"
    cy="69"
    r="4"
    fill="#475569"/>


  <!-- File name -->

  <text
    x="870"
    y="74"
    class="mono"
    font-size="10"
    text-anchor="middle"
    fill="#475569">

    developer.js

  </text>


  <!-- ================================================= -->
  <!-- CODE EDITOR SEPARATOR -->
  <!-- ================================================= -->

  <line
    x1="666"
    y1="108"
    x2="666"
    y2="324"
    stroke="#1E293B"
    stroke-width="1"/>


  <!-- ================================================= -->
  <!-- LINE NUMBERS -->
  <!-- ================================================= -->

  <g
    class="mono"
    font-size="11"
    fill="#334155"
    text-anchor="end">

    <text x="652" y="130">01</text>
    <text x="652" y="151">02</text>
    <text x="652" y="172">03</text>
    <text x="652" y="193">04</text>
    <text x="652" y="214">05</text>
    <text x="652" y="235">06</text>
    <text x="652" y="256">07</text>
    <text x="652" y="277">08</text>
    <text x="652" y="298">09</text>

  </g>


  <!-- ================================================= -->
  <!-- CODE -->
  <!-- ================================================= -->

  <g
    class="mono"
    font-size="11.5">


    <!-- Line 01 -->

    <text
      x="685"
      y="130"
      fill="#C4B5FD">

      const

      <tspan fill="#F8FAFC">
        developer
      </tspan>

      <tspan fill="#64748B">
        =
      </tspan>

    </text>


    <!-- Line 02 -->

    <text
      x="685"
      y="151"
      fill="#F8FAFC">

      {

    </text>


    <!-- Line 03 -->

    <text
      x="700"
      y="172"
      fill="#94A3B8">

      name:

      <tspan fill="#86EFAC">
        "Atharv Holkar"
      </tspan>

    </text>


    <!-- Line 04 -->

    <text
      x="700"
      y="193"
      fill="#94A3B8">

      role:

      <tspan fill="#86EFAC">
        "Full-Stack"
      </tspan>

    </text>


    <!-- Line 05 -->

    <text
      x="700"
      y="214"
      fill="#94A3B8">

      frontend:

      <tspan fill="#67E8F9">
        "React"
      </tspan>

    </text>


    <!-- Line 06 -->

    <text
      x="700"
      y="235"
      fill="#94A3B8">

      backend:

      <tspan fill="#67E8F9">
        "Node.js"
      </tspan>

    </text>


    <!-- Line 07 -->

    <text
      x="700"
      y="256"
      fill="#94A3B8">

      database:

      <tspan fill="#67E8F9">
        "MongoDB"
      </tspan>

    </text>


    <!-- Line 08 -->

    <text
      x="700"
      y="277"
      fill="#94A3B8">

      mindset:

      <tspan fill="#C4B5FD">
        "Build"
      </tspan>

    </text>


    <!-- Line 09 -->

    <text
      x="685"
      y="298"
      fill="#F8FAFC">

      }

    </text>

  </g>


  <!-- ================================================= -->
  <!-- STATUS -->
  <!-- ================================================= -->

  <circle
    cx="1062"
    cy="329"
    r="4"
    fill="#22C55E"/>

  <text
    x="1074"
    y="333"
    class="mono"
    font-size="10"
    fill="#64748B">

    BUILDING

  </text>


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <text
    x="66"
    y="365"
    class="mono"
    font-size="10"
    fill="#475569">

    &lt;learn /&gt; • &lt;build /&gt; • &lt;ship /&gt;

  </text>


</svg>
