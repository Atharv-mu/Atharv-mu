<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B1A"/>
      <stop offset="52%" stop-color="#101936"/>
      <stop offset="100%" stop-color="#1E1245"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14"
                    flood-color="#000000" flood-opacity=".35"/>
    </filter>

    <style>
      .sans {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .mono {
        font-family: "JetBrains Mono", "Courier New", monospace;
      }

      .muted {
        fill: #A5B4FC;
      }

      .white {
        fill: #F8FAFC;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="26" fill="url(#background)"/>

  <circle cx="110" cy="20" r="145"
          fill="#2563EB" opacity=".22" filter="url(#blur)"/>

  <circle cx="1090" cy="370" r="170"
          fill="#9333EA" opacity=".25" filter="url(#blur)"/>

  <!-- Decorative grid -->
  <g opacity=".12" stroke="#94A3B8">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M80 0V400M180 0V400M280 0V400M380 0V400
             M480 0V400M580 0V400M680 0V400M780 0V400
             M880 0V400M980 0V400M1080 0V400"/>
  </g>

  <!-- Left text section -->
  <text x="66" y="75" class="sans muted"
        font-size="14" font-weight="700" letter-spacing="2">
    B.TECH • COMPUTER SCIENCE
  </text>

  <rect x="66" y="96" width="86" height="5" rx="3" fill="url(#accent)"/>

  <text x="66" y="154" class="sans white"
        font-size="46" font-weight="800">
    3RD YEAR
  </text>

  <text x="66" y="207" class="sans"
        fill="#67E8F9" font-size="48" font-weight="800">
    CSE STUDENT
  </text>

  <text x="68" y="240" class="sans"
        fill="#CBD5E1" font-size="17">
    Aspiring Full-Stack Developer
  </text>

  <!-- Skill pills -->
  <g class="sans" font-size="12" font-weight="700">
    <rect x="68" y="266" width="78" height="28" rx="14"
          fill="#172554" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="107" y="284" text-anchor="middle" fill="#67E8F9">MERN</text>

    <rect x="154" y="266" width="92" height="28" rx="14"
          fill="#1E1B4B" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="200" y="284" text-anchor="middle" fill="#C4B5FD">BUILDING</text>

    <rect x="254" y="266" width="88" height="28" rx="14"
          fill="#172554" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="298" y="284" text-anchor="middle" fill="#67E8F9">LEARNING</text>
  </g>

  <!-- Code snippet -->
  <g class="mono" font-size="13">
    <text x="68" y="333" fill="#64748B">
      <tspan fill="#22D3EE">const</tspan>
      developer = <tspan fill="#C4B5FD">{ ... }</tspan>
    </text>
  </g>

  <!-- Main glass panel -->
  <rect x="535" y="42" width="590" height="310" rx="28"
        fill="#FFFFFF" fill-opacity=".07"
        stroke="#FFFFFF" stroke-opacity=".16"
        filter="url(#shadow)"/>

  <!-- Monitor -->
  <rect x="730" y="82" width="300" height="190" rx="16"
        fill="#050816" stroke="#64748B" stroke-opacity=".65"
        stroke-width="3"/>

  <!-- Browser header -->
  <rect x="730" y="82" width="300" height="30" rx="16"
        fill="#111827"/>

  <circle cx="750" cy="97" r="4" fill="#FB7185"/>
  <circle cx="764" cy="97" r="4" fill="#FBBF24"/>
  <circle cx="778" cy="97" r="4" fill="#34D399"/>

  <rect x="805" y="91" width="150" height="12" rx="6"
        fill="#1E293B"/>

  <!-- Screen -->
  <rect x="748" y="125" width="264" height="128" rx="8"
        fill="url(#screen)" opacity=".78"/>

  <g class="mono" font-size="12">
    <text x="765" y="149" fill="#67E8F9">const developer =</text>
    <text x="765" y="170" fill="#C4B5FD">{</text>
    <text x="780" y="191" fill="#F8FAFC">
      year: <tspan fill="#86EFAC">"3rd Year"</tspan>,
    </text>
    <text x="780" y="212" fill="#F8FAFC">
      stack: <tspan fill="#86EFAC">"MERN"</tspan>,
    </text>
    <text x="780" y="233" fill="#F8FAFC">
      mindset: <tspan fill="#86EFAC">"Build"</tspan>
    </text>
    <text x="765" y="248" fill="#C4B5FD">};</text>
  </g>

  <!-- Monitor stand -->
  <rect x="850" y="272" width="58" height="22" rx="4"
        fill="#475569"/>

  <rect x="815" y="293" width="128" height="8" rx="4"
        fill="#64748B"/>

  <!-- Person -->
  <rect x="622" y="184" width="28" height="30" rx="8"
        fill="#E7A98D"/>

  <circle cx="636" cy="154" r="40" fill="#F1B89B"/>

  <!-- Hair -->
  <path d="M597 153C595 116 614 96 640 98
           C671 99 687 119 679 153
           C671 132 655 123 638 123
           C621 123 608 135 597 153Z"
        fill="#0F172A"/>

  <!-- Glasses -->
  <g fill="none" stroke="#111827" stroke-width="4">
    <rect x="601" y="143" width="30" height="22" rx="7"/>
    <rect x="641" y="143" width="30" height="22" rx="7"/>
    <path d="M631 151Q636 147 641 151"/>
  </g>

  <circle cx="616" cy="154" r="2.5" fill="#111827"/>
  <circle cx="656" cy="154" r="2.5" fill="#111827"/>

  <!-- Hoodie -->
  <path d="M600 211C568 222 551 263 556 318
           H742C736 269 713 225 650 211Z"
        fill="url(#hoodie)"/>

  <path d="M620 213Q636 232 652 213"
        fill="none" stroke="#A78BFA" stroke-width="7"/>

  <line x1="628" y1="225" x2="623" y2="253"
        stroke="#DDD6FE" stroke-width="3"/>
  <line x1="645" y1="225" x2="650" y2="253"
        stroke="#DDD6FE" stroke-width="3"/>

  <!-- Arm -->
  <path d="M676 231C723 242 752 264 789 290
           L773 315C731 292 703 278 663 267Z"
        fill="#F1B89B"/>

  <circle cx="787" cy="300" r="12" fill="#F1B89B"/>

  <!-- Laptop -->
  <path d="M714 293H858L887 321H682Z"
        fill="#94A3B8"/>

  <path d="M727 287H842L858 308H713Z"
        fill="#0F172A"/>

  <rect x="774" y="291" width="38" height="3" rx="2"
        fill="#22D3EE"/>

  <!-- Tech badges -->
  <g class="sans" font-size="12" font-weight="700">
    <rect x="955" y="48" width="92" height="28" rx="14"
          fill="#0891B2"/>
    <text x="1001" y="66" text-anchor="middle" fill="white">React.js</text>

    <rect x="965" y="82" width="92" height="28" rx="14"
          fill="#16A34A"/>
    <text x="1011" y="100" text-anchor="middle" fill="white">Node.js</text>

    <rect x="965" y="116" width="108" height="28" rx="14"
          fill="#059669"/>
    <text x="1019" y="134" text-anchor="middle" fill="white">MongoDB</text>

    <rect x="965" y="150" width="108" height="28" rx="14"
          fill="#475569"/>
    <text x="1019" y="168" text-anchor="middle" fill="white">Express.js</text>
  </g>

  <!-- Coffee -->
  <rect x="1038" y="278" width="34" height="38"
        rx="5" fill="#92400E"/>

  <path d="M1072 287C1092 287 1092 306 1072 306"
        fill="none" stroke="#92400E" stroke-width="7"/>

  <ellipse cx="1055" cy="278" rx="16" ry="5"
           fill="#451A03"/>

  <!-- Footer -->
  <text x="850" y="337" class="mono"
        fill="#94A3B8" font-size="13"
        text-anchor="middle">
    &lt;learn /&gt; • &lt;build /&gt; • &lt;grow /&gt;
  </text>

</svg>
