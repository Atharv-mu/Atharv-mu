<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Monitor -->
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Shirt -->
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .code {
        font-family: monospace;
        font-size: 14px;
      }

      .title {
        font-family: Arial, sans-serif;
        font-weight: bold;
      }

      .small {
        font-family: Arial, sans-serif;
      }
    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200" height="400" fill="url(#bg)"/>


  <!-- Background glowing circles -->

  <circle cx="130"
          cy="80"
          r="100"
          fill="#2563eb"
          opacity="0.10"
          filter="url(#glow)"/>

  <circle cx="1080"
          cy="300"
          r="130"
          fill="#7c3aed"
          opacity="0.12"
          filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- STARS -->
  <!-- ================================================= -->

  <g fill="#67e8f9" opacity="0.7">

    <circle cx="70" cy="55" r="2"/>
    <circle cx="160" cy="310" r="2"/>
    <circle cx="290" cy="45" r="2"/>
    <circle cx="390" cy="90" r="2"/>
    <circle cx="760" cy="45" r="2"/>
    <circle cx="920" cy="55" r="2"/>
    <circle cx="1110" cy="100" r="2"/>
    <circle cx="1160" cy="330" r="2"/>
    <circle cx="1000" cy="360" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- LEFT SIDE TEXT -->
  <!-- ================================================= -->

  <text x="65"
        y="105"
        fill="#ffffff"
        font-size="40"
        class="title">
    FULL STACK
  </text>

  <text x="65"
        y="155"
        fill="#22d3ee"
        font-size="50"
        class="title">
    MERN DEVELOPER
  </text>

  <text x="68"
        y="193"
        fill="#94a3b8"
        font-size="18"
        class="small">
    Building modern web websites 🚀
  </text>


  <!-- ================================================= -->
  <!-- CODE DECORATION -->
  <!-- ================================================= -->

  <g class="code" fill="#64748b" opacity="0.75">

    <text x="68" y="240">
      &lt;developer&gt;
    </text>

    <text x="88" y="266">
      const stack = "MERN STACK";
    </text>

    <text x="88" y="292">
      build("something awesome");
    </text>

    <text x="68" y="318">
      &lt;/developer&gt;
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DESK -->
  <!-- ================================================= -->

  <rect x="625"
        y="320"
        width="510"
        height="17"
        rx="8"
        fill="#334155"/>

  <!-- Desk legs -->

  <rect x="690"
        y="337"
